---
layout: default
---
<article class="wrap page research-article">
  <header class="page-head">
    <p class="eyebrow"><a href="{{ '/research/' | relative_url }}">Research</a> / {{ page.period }}</p>
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ page.description }}</p>
  </header>
  {%- if page.brief %}
  <aside class="brief"><span class="label">In brief</span><p>{{ page.brief }}</p></aside>
  {%- endif %}
  <div class="prose">
    {{ content }}
  </div>
  <nav class="back"><a href="{{ '/research/' | relative_url }}">← All research</a></nav>
</article>

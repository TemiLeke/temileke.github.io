{%- assign items = site.news | sort: "date" | reverse -%}
{%- if include.limit %}{% assign items = items | slice: 0, include.limit %}{% endif -%}
<ol class="news">
  {%- for n in items %}
  <li>
    <time datetime="{{ n.date | date_to_xmlschema }}">{{ n.date | date: "%b %Y" }}</time>
    <div>{{ n.content | markdownify }}</div>
  </li>
  {%- endfor %}
</ol>

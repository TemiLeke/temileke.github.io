{%- assign nav = "Research:/research/,Publications:/publications/,News:/news/,CV:/cv/" | split: "," -%}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.profile.name }}, home">
      <span class="brand-mark">{{ site.profile.short }}</span>
      <span class="brand-name">{{ site.profile.name }}</span>
    </a>
    <nav aria-label="Primary">
      <ul>
        {%- for item in nav -%}
        {%- assign parts = item | split: ":" -%}
        <li><a href="{{ parts[1] | relative_url }}"{% if page.url contains parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
        {%- endfor -%}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
